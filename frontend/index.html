<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="apple-touch-icon" href="/app-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autumn Suite</title>
    <!-- Modern Typography: Plus Jakarta Sans, Outfit, Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedIntensity = localStorage.getItem('autumn-bg-intensity') || 'cozy';
          document.documentElement.setAttribute('data-bg-intensity', savedIntensity);
          var savedFont = localStorage.getItem('app-font-style') || 'jakarta';
          document.documentElement.setAttribute('data-font-style', savedFont);
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
